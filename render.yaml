services:
  - type: web
    name: eye-geometry-backend
    env: docker
    rootDir: eye-platform-alpha-geometry-backend/geometry-backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: EYE_RECONSTRUCTION_PROVIDER
        value: replicate
      - key: EYE_ALLOW_PROCEDURAL_FALLBACK
        value: "0"
      - key: EYE_LOCAL_SEGMENTATION
        value: "0"
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: EYE_REPLICATE_MODEL_VERSION
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false


  - type: web
    name: dragonfly-frontend
    runtime: static
    rootDir: eye-expo
    buildCommand: npm ci && npm run build:web
    staticPublishPath: ./dist
    envVars:
      - key: EXPO_PUBLIC_GEOMETRY_API_BASE
        value: https://eye-geometry-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html